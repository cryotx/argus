services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: argus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - argus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argus -d argus"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  argus-postgres-data:
