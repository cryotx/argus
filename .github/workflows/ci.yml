name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_open_source_ready.sh --secrets-only

  secret-history:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          scan_dir="$(mktemp -d)"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --location --silent --show-error "$base/$archive" -o "$scan_dir/$archive"
          curl --fail --location --silent --show-error "$base/$checksums" -o "$scan_dir/$checksums"
          (cd "$scan_dir" && sha256sum --check --ignore-missing "$checksums")
          tar -xzf "$scan_dir/$archive" -C "$scan_dir" gitleaks
          "$scan_dir/gitleaks" git --redact --no-banner --log-opts="--all" .

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check API contract inventory
        run: python3 scripts/check_openapi_contract.py

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace

      - name: Build workspace
        run: cargo build --workspace

  integration-db:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: argus
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argus -d argus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ARGUS_DATABASE_URL: postgres://argus:argus@127.0.0.1:5432/argus
      ARGUS_MASTER_KEY: 0123456789abcdef0123456789abcdef
      ARGUS_ACTOR_ROLE: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U argus -d argus && exit 0
            sleep 2
          done
          echo "PostgreSQL did not become ready in time" >&2
          exit 1

      - name: Run migrations
        run: cargo run -p argus-cli -- migrate

      - name: Run ignored integration tests
        run: cargo test -p argus-cli -- --ignored --nocapture --test-threads=1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
      - name: Check generated contract is current
        run: git diff --exit-code -- web/src/services/openapi.generated.ts

  e2e-mvp:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: argus
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U argus -d argus"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      ARGUS_DATABASE_URL: postgres://argus:argus@127.0.0.1:5432/argus
      ARGUS_MASTER_KEY: 0123456789abcdef0123456789abcdef
      ARGUS_ACTOR_ROLE: admin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U argus -d argus && exit 0
            sleep 2
          done
          echo "PostgreSQL did not become ready in time" >&2
          exit 1

      - name: Run MVP end-to-end scenario
        run: ./scripts/e2e_mvp.sh
